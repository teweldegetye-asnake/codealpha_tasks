<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet" href="calculator.css">
    </head>
    <body>
        <div id="calculator">
            <div id="topPart">
                <input type="text" name="number" value="0" step="any">
            </div>
            <div class="keyboard">
                <ul>
                  <div class="operations">
                    <li id="ac">AC</li>
                    <li id="x" class="basicOperations">❌</li>
                    <li class="basicOperations" value="/">➗</li>
                    <li class="basicOperations" value="*">✖️</li>
                    <li class="basicOperations" value="-">➖</li>
                    <li class="basicOperations" value="+">➕</li>
                    <li id="equal" value=" = ">🟰</li>
                  </div>
                  <div class="numbers">
                    <li class="number" id="number1">0</li>
                    <li class="number">1</li>
                    <li class="number">2</li>
                    <li class="number">3</li>
                    <li class="number">4</li>
                    <li class="number">5</li>
                    <li class="number">6</li>
                    <li class="number">7</li>
                    <li class="number">8</li>
                    <li class="number">9</li>
                    <li class="number">.</li>
                    <li class="number">(</li>
                    <li class="number">)</li>
                  </div> 
                </ul>
            </div>
        </div>
        <script src="calculator.js"></script>
    </body>
</html>
